<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Blue Shield/Circle -->
  <circle cx="50" cy="50" r="48" fill="#00246B" stroke="#F59E0B" stroke-width="2.5" />
  
  <!-- Outer Gear Teeth (24 cogs for Rotary Wheel) -->
  <g fill="#F59E0B">
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(0 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(15 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(30 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(45 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(60 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(75 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(90 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(105 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(120 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(135 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(150 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(165 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(180 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(195 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(210 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(225 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(240 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(255 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(270 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(285 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(300 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(315 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(330 50 50)" />
    <rect x="48" y="8" width="4" height="6" rx="1" transform="rotate(345 50 50)" />
  </g>

  <!-- Rotary Gear Rim -->
  <circle cx="50" cy="50" r="38" fill="#F59E0B" />
  <circle cx="50" cy="50" r="32" fill="#00246B" />

  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="18" fill="#F59E0B" />

  <!-- Center Hole & Keyway -->
  <circle cx="50" cy="50" r="10" fill="#00246B" />
  <rect x="48" y="38" width="4" height="6" fill="#00246B" />

  <!-- 6 Spokes -->
  <g stroke="#00246B" stroke-width="3.5" stroke-linecap="round">
    <line x1="50" y1="50" x2="76" y2="50" />
    <line x1="50" y1="50" x2="63" y2="72.5" />
    <line x1="50" y1="50" x2="37" y2="72.5" />
    <line x1="50" y1="50" x2="24" y2="50" />
    <line x1="50" y1="50" x2="37" y2="27.5" />
    <line x1="50" y1="50" x2="63" y2="27.5" />
  </g>

  <!-- Interact Text Badge -->
  <path d="M 22 50 A 28 28 0 0 1 78 50" id="interactTextPath" fill="none" />
  <text fill="#FFFFFF" font-size="7.5" font-weight="900" letter-spacing="1.2">
    <textPath href="#interactTextPath" start-offset="50%" text-anchor="middle">
      INTERACT
    </textPath>
  </text>
</svg>
